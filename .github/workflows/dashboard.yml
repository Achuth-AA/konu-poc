# Dashboard check: the Vercel site must build. (Vercel itself deploys from main.)
name: dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
